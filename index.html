<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopDesk | Inventory & Sales</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><div><h1>ShopDesk</h1><p>Offline shop inventory & sales dashboard</p></div><button id="export">Export Backup</button></header><section class="stats"><article><span>Products</span><strong id="productsCount">0</strong></article><article><span>Stock Value</span><strong id="stockValue">Rs 0</strong></article><article><span>Total Revenue</span><strong id="revenue">Rs 0</strong></article><article><span>Gross Profit</span><strong id="profit">Rs 0</strong></article></section><section class="grid"><div class="card"><h2>Add Product</h2><form id="productForm"><label>Product name<input id="name" required maxlength="80" placeholder="e.g. Milk 1L"></label><label>Cost price (Rs)<input id="cost" required type="number" min="0" step="0.01"></label><label>Sale price (Rs)<input id="price" required type="number" min="0" step="0.01"></label><label>Opening stock<input id="stock" required type="number" min="0" step="1"></label><button type="submit">Add Product</button></form></div><div class="card"><h2>Record Sale</h2><form id="saleForm"><label>Product<select id="saleProduct" required></select></label><label>Quantity<input id="quantity" type="number" min="1" step="1" value="1" required></label><button type="submit">Record Sale</button></form><p id="message" role="status"></p></div></section><section class="card"><div class="row"><h2>Inventory</h2><input id="search" aria-label="Search inventory" placeholder="Search products..."></div><div class="scroll"><table><thead><tr><th>Product</th><th>Cost</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody id="inventory"></tbody></table></div></section><section class="card"><h2>Recent Sales</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Revenue</th><th>Profit</th></tr></thead><tbody id="sales"></tbody></table></div></section><footer>Data stays in this browser using localStorage. Export backups regularly.</footer></main><script src="app.js"></script></body></html>
